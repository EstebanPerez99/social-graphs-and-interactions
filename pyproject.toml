[project]
name = "sgi"
version = "0.1.0"
description = "Herramientas del curso 02805 Social Graphs and Interactions"
requires-python = ">=3.12"
dependencies = ["networkx", "pandas", "numpy", "scipy", "matplotlib", "requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sgi"]
